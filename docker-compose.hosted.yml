# Docker Compose configuration for DEVELOPMENT
# Uses VITE_DEV_MODE=true for hot reload and dev servers

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: byaan
      POSTGRES_PASSWORD: byaan_password
      POSTGRES_DB: byaan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byaan"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: byaan
    build:
      context: .
      dockerfile: ./server/Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - ./server/.data:/app/server/.data
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude:/local/.claude
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Docker-specific settings (can't be in .env - use container paths/hostnames)
      - PYTHONPATH=/app
      - HOME=/root
      - DATABASE_URL=postgresql+asyncpg://byaan:byaan_password@db:5432/byaan
      - APP_MODE=self-hosted
      # Dev mode: enable hot reload
      - VITE_DEV_MODE=true
      - BYAAN_HOST_PROJECT_DIR=${PWD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.pnpm-store
    env_file:
      - .env
    environment:
      # Docker-specific settings (can't be in .env - use container hostname)
      - VITE_API_URL=http://server:8000
      # Dev mode: use Vite dev server with HMR
      - VITE_DEV_MODE=true
      - FRONTEND_PORT=5173
      - WAIT_FOR_BACKEND=true
      - PRINT_CLIENT_URL=false
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
