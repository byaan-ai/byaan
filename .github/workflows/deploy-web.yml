name: Deploy Web to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate deployment source
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$GITHUB_ACTOR" != "hadijaveed" ]; then
            echo "Only hadijaveed may run web deployment workflows."
            echo "Current actor: $GITHUB_ACTOR"
            exit 1
          fi

          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production web deploys must be dispatched from main."
            echo "Current ref: $GITHUB_REF"
            exit 1
          fi

          if [ "$DEPLOY_ENVIRONMENT" = "staging" ] \
            && [ "$GITHUB_REF" != "refs/heads/main" ] \
            && [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "Staging web deploys must be dispatched from main or develop."
            echo "Current ref: $GITHUB_REF"
            exit 1
          fi

          echo "Trusted deployment source verified."

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://app.infisical.com"
          env-slug: "prod"
          project-slug: "byaan-app-secrets-i-ffg"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Build website
        run: |
          cd web
          npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=byaan-web --compatibility-date=2024-10-26
          workingDirectory: web

      - name: Output deployment URL
        run: |
          echo "🚀 Deployment complete!"
          echo "Your website is now live at: ${{ steps.deploy.outputs.deployment-url }}"
