# Docker Compose for LOCAL/COMMUNITY development (SQLite, no PostgreSQL)
# Usage: make dev | make dev-build | make stop

services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
      target: runtime
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-17433}:8000"
      - "127.0.0.1:8020:8020"
    volumes:
      - .:/app
      - /app/.venv
      - ./server/.data:/app/server/.data
    environment:
      - PYTHONPATH=/app
      - HOME=/root
      - APP_MODE=community
      - VITE_DEV_MODE=true
      - BYAAN_HOST_PROJECT_DIR=${PWD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "pl-0-us-east-1.enw6a.mongodb.net:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      target: dev
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-17434}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.pnpm-store
    environment:
      - VITE_API_URL=http://server:8000
      - VITE_DEV_MODE=true
      - FRONTEND_PORT=${FRONTEND_PORT:-17434}
      - WAIT_FOR_BACKEND=true
      - PRINT_CLIENT_URL=false
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
